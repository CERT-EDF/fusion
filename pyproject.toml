[project]
name = "edf-fusion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["edf", "fusion", "framework", "library"]
description = "Fusion Framework Library"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [
  { name="CERT-EDF", email="cert@edf.fr" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
    "Topic :: Security",
]
dependencies = [
    "rich~=15.0",
    "redis~=8.0",
    "pyyaml~=6.0",
    "aiofile~=3.11",
    "aiosqlite~=0.22",
    "aiohttp~=3.14",
    "aiohttp-sse~=2.2",
    "aiohttp-session[secure]~=2.12",
]


[project.optional-dependencies]
auth_basic = ["argon2-cffi~=25.1"]
auth_keycloak = ["python-keycloak~=7.1"]


[project.urls]
"Homepage" = "https://github.com/cert-edf/fusion"
"Repository" = "https://github.com/cert-edf/fusion"
"Bug Tracker" = "https://github.com/cert-edf/fusion/issues"


[build-system]
requires = ["setuptools>=83", "setuptools_scm>=10", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["edf_fusion", "edf_fusion.*"]


[tool.setuptools_scm]
version_file = "edf_fusion/__version__.py"


[tool.ruff]
include = ["pyproject.toml", "edf_fusion/**/*.py"]
exclude = ["edf_fusion/__version__.py"]
line-length = 79


[tool.ruff.format]
quote-style = "preserve"
